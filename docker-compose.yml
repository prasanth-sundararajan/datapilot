# Local run:  docker compose up -d --build   ->  http://localhost:8520
# Secrets come from .env on the host (see .env.example), never from this file.
services:
  datapilot:
    build: .
    image: datapilot:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "8520:8501"
    volumes:
      - sandbox:/app/sandbox
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256

volumes:
  sandbox:
